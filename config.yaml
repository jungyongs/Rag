# =====================================================================
# Central configuration for the whole project.
#
# - All relative paths are resolved against the project root.
# - Effective config for one model (later wins, nested dicts are merged):
#     BF16  (src/train_benchmark.py): defaults < models.<key>
#     4-bit (src/train_qlora.py)    : defaults < models.<key>
#                                     < qlora < models.<key>.qlora
# - Used by:
#     src/train_benchmark.py      (--model <key>)   BF16 full / LoRA
#     src/train_qlora.py          (--model <key>)   4-bit QLoRA
#     scripts/download_models.py  (--model <key>|all)
#     scripts/quantize_models.py  (--model <key>|all)
#     scripts/run_benchmark*.sh   (<model_key>)
#     scripts/run_qlora.sh        (<model_key>)
#     make_dummy_1gb.py
# =====================================================================

# ---------------------------------------------------------------------
# Dummy corpus generation (make_dummy_1gb.py)
# ---------------------------------------------------------------------
dummy_data:
  output_path: data/raw/dummy_1gb.txt
  target_mib: 100
  block_mib: 8

# ---------------------------------------------------------------------
# Defaults shared by every model
# ---------------------------------------------------------------------
defaults:
  # Data / tokenization cache
  data_path: data/raw/data_out_step4_train_eos_v4.txt   # copied once from ~/shared
  file_pattern: "**/*.txt"
  # Files whose name contains any of these strings are left out of training
  # (e.g. 고객정보_T_샘플.xlsx.txt: names, resident numbers, addresses, phones).
  exclude_name_keywords:
    - 고객정보
  # Paths (relative to data_path, i.e. the preprocessed filtered/ tree) left
  # out of training. A folder entry excludes everything below it. Each entry
  # is matched component by component (fnmatch, NFC) as consecutive folders
  # anywhere in the file's relative path. Zips were unpacked by the
  # preprocessor into a folder named after the zip without ".zip".
  exclude_paths:
    - 위드팜&DRxSolution/처방전데이터샘플
    - 위드팜&DRxSolution/디알엑스 상담 데이터/디알엑스내부_상담_샘플
    - 위드팜&DRxSolution/바코드QR업체별_처방전_구조
    - 위드팜&DRxSolution/내손안의약국_API_명세서_SAMPLE.pdf.txt
    - 위드팜&DRxSolution/학습_데이터_수집/INDEX.md.txt
    - 공공_약가*            # everything unpacked from the 공공_약가*.zip files
    - 위드팜&DRxSolution/건강보험심사평가원_의약품안전사용서비스(DUR) 의약품 목록_20260601
    - 위드팜&DRxSolution/한국의약품안전관리원_DUR_성분기준약물정보_20260721
  seq_len: 2048
  # Split each file into documents at this literal string (it is removed
  # from the text); each document then ends with the model's own EOS token
  # and is shuffled on its own. null: one document per file.
  document_separator: "<|endoftext|>"
  shuffle_documents: true
  data_seed: 0             # document shuffle; keep fixed
  add_eos_between_documents: true
  # Token added after each document. null: the tokenizer's eos_token. Set
  # it per model when eos_token is a chat token (e.g. <|im_end|>).
  document_end_token: null
  tokenize_chunk_chars: 1000000
  cache_wait_timeout_seconds: 86400

  # Training mode: fft (full fine-tuning) | lora
  training_mode: fft
  attn_implementation: flash_attention_2   # sdpa | flash_attention_2

  # Batch
  micro_batch_size: 1
  gradient_accumulation_steps: 1

  # Precision / memory
  bf16: true
  tf32: true
  gradient_checkpointing: true

  # Optimizer
  optim: adamw_torch
  learning_rate: 1.0e-5
  weight_decay: 0.1

  # Schedule / logging
  max_steps: -1
  num_train_epochs: 1.0
  benchmark_warmup_steps: 20
  logging_steps: 10
  dataloader_num_workers: 4
  seed: 0

  # Checkpointing / resume (checkpoint_root/<output_dir>/<run>/checkpoint-<step>/)
  #   Full training state (weights or adapters + optimizer + scheduler +
  #   RNG + DeepSpeed shards) is saved, so a run that was cut off continues
  #   from the last complete checkpoint when launched again with the same
  #   command. Resuming needs the same GPU count (it is part of the run dir).
  # Local disk, not ~/shared. Relative output_dir values are placed here.
  checkpoint_root: /home/shadeform/checkpoints
  # Checkpoints at these points of the run are kept (never rotated) and are
  # marked with MILESTONE.json; 100 is the end of training.
  milestone_percents: [25, 50, 75, 100]
  # true: every milestone saves only the bf16 weights (plain HF model /
  # adapter in milestone-<pct>pct-step<N>/, for evaluation). The full
  # training state (checkpoint-<step>/, for continuing training) is saved
  # only at the end of training, or when a run is stopped. The 100%
  # milestone doubles as the final model.
  # false: milestones are full checkpoints and are all kept.
  milestone_weights_only: true
  # One fine-tuning at a time: a run does not start while checkpoint_root
  # holds another run's checkpoints or a finished (100%) run. Copy the
  # milestones off the machine, then clear them by hand with
  # scripts/clear_checkpoints.py. Nothing deletes or starts runs on its own.
  # Only the milestones are saved: no periodic saves in between. A stop
  # (SIGTERM / Ctrl+C / --stop_at) still saves one resume checkpoint.
  save_steps: 0            # save every N optimizer steps; 0 disables
  save_interval_minutes: 0   # also save every N minutes; 0 disables
  # Keep only the newest N non-milestone (resume) checkpoints; 0 keeps all.
  # With 1, the previous one is deleted right after the new one is
  # completely written (never overwritten in place, so a shutdown mid-save
  # cannot lose both).
  save_total_limit: 1
  resume: true             # auto-resume (CLI: --no_resume / --resume_from_checkpoint)

  # GPU reservation end: launch with --stop_at "2026-10-09 18:00" (or env
  # STOP_AT=... for scripts/run_*.sh). Training saves and exits cleanly this
  # many minutes before it. Must cover one checkpoint save (+ final sync).
  stop_margin_minutes: 10

  # Mirror output_dir/<run>/ here after every checkpoint (rsync, rank 0).
  # Local/mounted path or user@host:/path (passwordless SSH). null disables.
  checkpoint_sync_target: null

  # Save a plain HF model / LoRA adapter to output_dir/<run>/final at the end.
  export_final_model: true

  report_to: tensorboard   # tensorboard | none  (logs in output_dir/<run>/tensorboard)

# ---------------------------------------------------------------------
# 4-bit QLoRA settings (src/train_qlora.py, scripts/quantize_models.py)
#   Applied on top of defaults + the model entry. 4-bit weights are frozen,
#   so training is always LoRA adapters on a quantized base.
# ---------------------------------------------------------------------
qlora:
  # false: quantize the BF16 checkpoint (`model_path`) on load
  # true : load `quantized_model_path` (run scripts/quantize_models.py first)
  use_prequantized: false

  quantization:
    bnb_4bit_quant_type: nf4          # nf4 | fp4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_quant_storage: bfloat16  # must be bfloat16 for ZeRO-3

  # ZeRO-2: each GPU holds the whole 4-bit model. Use zero3_qlora.json
  # to shard it (set per model below for 70B+).
  deepspeed_config: configs/deepspeed/zero2_qlora.json

  optim: adamw_torch
  learning_rate: 1.0e-4
  weight_decay: 0.0

  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: none
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# ---------------------------------------------------------------------
# Models
#   repo_id              : Hugging Face repo (used by download_models.py)
#   model_path           : local BF16 checkpoint location
#   quantized_model_path : local 4-bit checkpoint (quantize_models.py output)
#   qlora                : per-model overrides used only for 4-bit runs
# ---------------------------------------------------------------------
models:
  ax4_72b:
    repo_id: skt/A.X-4.0
    model_path: models/AX-4.0
    quantized_model_path: models/AX-4.0-bnb-4bit
    cache_path: data/cache/ax4_72b_seq2048
    output_dir: ax4_72b
    deepspeed_config: configs/deepspeed/zero3_cpu_offload.json
    stop_margin_minutes: 40   # ~1 TB full-FT checkpoint (bf16 weights + fp32 Adam)
    qlora:
      deepspeed_config: configs/deepspeed/zero3_qlora.json
      stop_margin_minutes: 10

  ax4_light_7b:
    repo_id: skt/A.X-4.0-Light
    model_path: models/AX-4.0-Light
    quantized_model_path: models/AX-4.0-Light-bnb-4bit
    cache_path: data/cache/ax4_light_7b_seq2048
    output_dir: ax4_light_7b
    deepspeed_config: configs/deepspeed/zero2.json
    # Chat model: eos_token is <|im_end|>; documents end with <|endoftext|>.
    document_end_token: "<|endoftext|>"

  qwen25_72b:
    repo_id: Qwen/Qwen2.5-72B
    model_path: models/Qwen2.5-72B
    quantized_model_path: models/Qwen2.5-72B-bnb-4bit
    cache_path: data/cache/qwen25_72b_seq2048
    output_dir: qwen25_72b
    deepspeed_config: configs/deepspeed/zero3_cpu_offload.json
    stop_margin_minutes: 40   # ~1 TB full-FT checkpoint (bf16 weights + fp32 Adam)
    qlora:
      deepspeed_config: configs/deepspeed/zero3_qlora.json
      stop_margin_minutes: 10

  qwen25_72b_lora:
    repo_id: Qwen/Qwen2.5-72B
    model_path: models/Qwen2.5-72B
    quantized_model_path: models/Qwen2.5-72B-bnb-4bit
    cache_path: data/cache/qwen25_72b_seq2048
    output_dir: qwen25_72b_lora
    deepspeed_config: configs/deepspeed/zero3_lora.json
    training_mode: lora
    learning_rate: 1.0e-4
    weight_decay: 0.0
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_bias: none
    lora_target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  qwen3_8b:
    repo_id: Qwen/Qwen3-8B-Base
    model_path: models/Qwen3-8B-Base
    quantized_model_path: models/Qwen3-8B-Base-bnb-4bit
    cache_path: data/cache/qwen3_8b_seq2048
    output_dir: qwen3_8b
    deepspeed_config: configs/deepspeed/zero2.json

  apertus_70b:
    repo_id: EPFLiGHT/Apertus-70B-MeditronFO
    model_path: models/Apertus-70B-MeditronFO
    quantized_model_path: models/Apertus-70B-MeditronFO-bnb-4bit
    cache_path: data/cache/apertus_70b_seq2048
    output_dir: apertus_70b
    deepspeed_config: configs/deepspeed/zero3_cpu_offload.json
    stop_margin_minutes: 40   # ~1 TB full-FT checkpoint (bf16 weights + fp32 Adam)
    qlora:
      deepspeed_config: configs/deepspeed/zero3_qlora.json
      stop_margin_minutes: 10
