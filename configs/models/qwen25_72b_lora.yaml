name: qwen25_72b_lora

model_path: models/Qwen2.5-72B
data_path: data/raw/dummy_1gb.txt
cache_path: data/cache/qwen25_72b_seq2048
output_dir: outputs/qwen25_72b_lora

training_mode: lora
deepspeed_config: configs/deepspeed/zero3_lora.json

attn_implementation: sdpa

seq_len: 32

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_bias: none

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

micro_batch_size: 1
gradient_accumulation_steps: 1

bf16: true
tf32: true
gradient_checkpointing: true

learning_rate: 1.0e-4
weight_decay: 0.0
optim: adamw_torch

max_steps: -1
num_train_epochs: 1.0

benchmark_warmup_steps: 20
logging_steps: 10
dataloader_num_workers: 4
seed: 42